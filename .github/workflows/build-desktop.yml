name: Build desktop app

# Builds the macOS and Windows desktop bundles, smoke-tests that each one actually
# starts and serves the API, and publishes them as assets on a GitHub Release.
# Triggered by pushing a version tag (e.g. v1.0.1) or manually.
#
# Release assets are used instead of actions/upload-artifact on purpose: they live
# in separate storage that does NOT count against the Actions artifact quota.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build bundle
        run: |
          cd backend
          python -m PyInstaller forecast.spec --noconfirm --clean

      # A green build is not enough: start the frozen app headless and require
      # /api/health to answer (catches missing modules / native libraries).
      - name: Smoke test (start bundle, render a map and a sounding)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXE="backend/dist/Forecast Workstation.app/Contents/MacOS/ForecastWorkstation"
          else
            EXE="backend/dist/ForecastWorkstation/ForecastWorkstation.exe"
          fi
          FORECAST_HEADLESS=1 "$EXE" &
          B=http://127.0.0.1:8766
          up=0
          for i in $(seq 1 90); do curl -sf $B/api/health && { up=1; break; }; sleep 2; done
          [ $up = 1 ] || { echo "app did not start"; exit 1; }
          RUN=$(curl -sf $B/api/models/ecmwf/runs | python -c "import sys,json; print(json.load(sys.stdin)[0]['run'])")
          echo "ECMWF run $RUN"
          # exercises GRIB download + ecCodes + MetPy + the spawn-based render pool
          curl -sf -o snd.png "$B/api/sounding.png?model=ecmwf&run=$RUN&step=24&lat=38.72&lon=-9.14"
          curl -sf -o map.png "$B/api/map?model=ecmwf&run=$RUN&step=24&region=iberia&preset=t850"
          python -c "import sys; [sys.exit(f + ' is not a PNG') for f in ('snd.png','map.png') if open(f,'rb').read(8) != bytes([137,80,78,71,13,10,26,10])]; print('render OK')"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd backend/dist && zip -ry "$GITHUB_WORKSPACE/Forecast-Workstation-macOS-AppleSilicon.zip" "Forecast Workstation.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path backend/dist/ForecastWorkstation -DestinationPath Forecast-Workstation-Windows.zip

      # Both matrix jobs target the same tag; the action upserts the release and
      # appends this OS's asset.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Forecast Workstation ${{ github.ref_name }}
          files: Forecast-Workstation-*.zip
          fail_on_unmatched_files: true
